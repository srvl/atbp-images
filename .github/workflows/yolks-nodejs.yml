name: build nodejs yolks

# Ptero-Eggs/yolks nodejs images (same Dockerfiles and entrypoint), rebuilt here because the upstream
# nodejs workflow stopped running in June 2026 and its images still carry old Node releases.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - yolks-nodejs/**

permissions:
  actions: read
  packages: write

jobs:
  push:
    name: "nodejs_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./yolks-nodejs
          file: ./yolks-nodejs/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/srvl/atbp-images:nodejs_${{ matrix.tag }}
